[project]
name = "agent-complaints"
version = "0.1.0"
description = "Learning 'AI Coding Workflows: From Cloud to Local'"
readme = "README.md"
authors = [
    { name = "Sushovan Karmakar", email = "sushovankarmakar1996@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.115.10",
]

[project.scripts]
agent-complaints = "agent_complaints:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

